baseURL = 'https://event-based-banking-application.github.io/arya-banking/'
languageCode = 'en-us'
title = 'Arya Banking Docs'

[module]
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[markup.goldmark.renderer]
  unsafe = true

[params]
  google_fonts       = [["Inter", "300, 400, 600, 700"], ["Fira Code", "500, 700"]]
  sans_serif_font    = "Inter"
  mono_font          = "Fira Code"
  landingPage        = false  # disables the theme landing page

[params.footer]
  copyright = "© 2025 Arya Banking"

[params.docs]
  title           = "Event Based Banking Application"
  pathName        = "docs"    # you likely already have this
  landingPage     = false  # disables the theme landing page
  themeColor      = "blue"
  darkMode        = true          # ← enables the toggle switch in the navbar
  prism           = true
  prismTheme      = "lucario"     # ← dark-friendly: lucario | twilight (was: lotusdocs)
  sidebarIcons    = true
  titleIcon       = true
  toc             = true
  tocMobile       = true
  scrollSpy       = true
  breadcrumbs     = true
  descriptions    = true
  backToTop       = true
  navDesc         = true
  extLinkNewTab   = true
  intLinkTooltip  = true

[params.social]
  github = "Event-Based-Banking-Application"

[params.flexsearch]
  enabled      = true
  tokenize     = "forward"
  minQueryChar = 2
  maxResult    = 8