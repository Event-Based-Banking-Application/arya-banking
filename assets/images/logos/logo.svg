<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Pediment (triangle roof) -->
  <polygon points="30,2 50,20 10,20" fill="#0066ff"/>
  <!-- Top bar -->
  <rect x="8" y="20" width="44" height="5" rx="2" fill="#0066ff"/>
  <!-- Left column -->
  <rect x="13" y="28" width="6" height="22" rx="1.5" fill="#0066ff"/>
  <!-- Center column -->
  <rect x="27" y="28" width="6" height="22" rx="1.5" fill="#0066ff"/>
  <!-- Right column -->
  <rect x="41" y="28" width="6" height="22" rx="1.5" fill="#0066ff"/>
  <!-- Base platform -->
  <rect x="6" y="52" width="48" height="6" rx="2" fill="#0066ff"/>
  <!-- Coin circle -->
  <circle cx="30" cy="13" r="5" fill="none" stroke="white" stroke-width="2"/>
</svg>
